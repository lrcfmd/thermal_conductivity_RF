[project]
name = "thermal-conductivity-rf"
version = "1.0.0"
description = "Random-forest prediction of thermal conductivity from chemical composition, for the LMDS platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "boto3>=1.34.0",
    "structlog>=25.5.0",
    # Magpie ElementProperty featurisation (pymatgen Composition parsing).
    # The random forest itself is evaluated directly from the original
    # scikit-learn 0.22.2 pickle (see src/model/forest.py), so no old
    # scikit-learn pin is needed.
    "matminer>=0.9.3",
    "pymatgen>=2024.1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
model-run = "cmds.run:run_cli"
model-types = "cmds.model_types:main"
validate-model = "cmds.validate_model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The model file is NOT bundled in the wheel or image — it is provided to the
# application at runtime (see src/model/artifacts/README.md). Exclude it
# explicitly: the Docker build context has no .git, so VCS-ignore alone would
# not keep the locally-present files out of the wheel. featurizer_state.json
# (11 KB, exported from featurizer.pk) IS package data and ships in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/cmds", "src/infrastructure", "src/model"]
exclude = ["src/model/artifacts/*"]

[tool.uv]
package = true
